<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUCLEO</title>
    <style>
        body {
            background: #ffffff;
            color: #000000;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .console-container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border: 1px solid #000000;
            border-radius: 4px;
            overflow: hidden;
        }
        .console-header {
            background: #000000;
            color: #ffffff;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 1em;
        }
        .console-log {
            height: 400px;
            padding: 15px;
            overflow-y: auto;
            background: #ffffff;
            border-bottom: 1px solid #cccccc;
            font-size: 0.95em;
            line-height: 1.6;
        }
        .msg-usuario {
            text-align: right;
            color: #000000;
            margin: 6px 0;
            padding: 3px 6px;
        }
        .msg-sistema {
            text-align: left;
            color: #000000;
            margin: 6px 0;
            padding: 3px 6px;
        }
        .input-area {
            padding: 15px;
            background: #f9f9f9;
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            height: 60px;
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            border-radius: 2px;
            padding: 8px;
            font-family: monospace;
            font-size: 0.95em;
            resize: none;
        }
        textarea:focus {
            outline: none;
            border-color: #555555;
        }
        button {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 0 20px;
            font-size: 0.95em;
            font-family: monospace;
            cursor: pointer;
            border-radius: 2px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="console-container">
        <div class="console-header">NUCLEO | MODO LOCAL</div>

        <div id="console-log" class="console-log">
            <div class="msg-sistema">Sistema operativo. Esperando instrucciones.</div>
        </div>

        <div class="input-area">
            <textarea id="idea-input" placeholder="Escribe aquí..."></textarea>
            <button onclick="transmitirAlNucleo()">Enviar</button>
        </div>
    </div>

    <script>
        function transmitirAlNucleo() {
            const input = document.getElementById('idea-input');
            const log = document.getElementById('console-log');
            const idea = input.value.trim();
            
            if (!idea) return;

            // Mostrar mensaje del usuario
            const entradaUsuario = document.createElement('div');
            entradaUsuario.className = 'msg-usuario';
            entradaUsuario.textContent = idea;
            log.appendChild(entradaUsuario);
            input.value = '';
            log.scrollTop = log.scrollHeight;

            // Enviar datos al sistema
            fetch('/procesar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contenido: idea })
            })
            .then(response => response.json())
            .then(data => {
                // Mostrar respuesta del sistema
                const respuestaSystema = document.createElement('div');
                respuestaSystema.className = 'msg-sistema';
                respuestaSystema.textContent = data.respuesta;
                log.appendChild(respuestaSystema);
                log.scrollTop = log.scrollHeight;
            })
            .catch(error => {
                const errorMsg = document.createElement('div');
                errorMsg.className = 'msg-sistema';
                errorMsg.textContent = 'Error de conexión.';
                log.appendChild(errorMsg);
                log.scrollTop = log.scrollHeight;
            });
        }
    </script>
</body>
</html>
