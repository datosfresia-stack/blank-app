<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUCLEO AUTÓNOMO | CONSOLA</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            font-size: 16px;
        }
        #consola {
            border: 1px solid #0f0;
            padding: 15px;
            height: 70vh;
            overflow-y: auto;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }
        #entrada {
            width: 100%;
            background: #111;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>🚀 NÚCLEO AUTÓNOMO - SISTEMA OPERATIVO</h1>
    <div id="consola">✅ Sistema listo. Escribe algo...</div>
    <input type="text" id="entrada" placeholder="Escribe aquí y presiona ENTER...">

    <script>
        const consola = document.getElementById('consola');
        const entrada = document.getElementById('entrada');

        entrada.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const mensaje = entrada.value;
                if (!mensaje) return;
                
                // Mostramos lo que escribes
                consola.innerHTML += `\n> ${mensaje}`;
                entrada.value = "";

                // Enviamos al sistema
                fetch('/transmitir', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({mensaje: mensaje, canal: "PRUEBA_LOCAL"})
                })
                .then(res => res.json())
                .then(datos => {
                    consola.innerHTML += `\n${datos.respuesta}`;
                    consola.scrollTop = consola.scrollHeight;
                })
                .catch(err => {
                    consola.innerHTML += `\n❌ ERROR: No hay conexión con el núcleo`;
                });
            }
        });
    </script>
</body>
</html>
