<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛸 NÚCLEO — Consola de Alta Disponibilidad</title>
    <style>
        body { 
            background-color: #000000; 
            color: #00ff66; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .console-container { 
            width: 100%; 
            max-width: 950px; 
            background: #050a05; 
            border: 2px solid #00ff66; 
            border-radius: 8px; 
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.25); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        .tabs-bar { 
            display: flex; 
            background: #000000; 
            border-bottom: 2px solid #00ff66; 
            flex-wrap: wrap; 
        }
        .tab-btn { 
            flex: 1; 
            min-width: 120px; 
            background: none; 
            border: none; 
            color: #00aa44; 
            padding: 14px; 
            cursor: pointer; 
            font-family: monospace; 
            font-weight: bold; 
            transition: all 0.3s; 
            text-transform: uppercase; 
            font-size: 0.9em; 
            border-right: 1px solid rgba(0, 255, 102, 0.3); 
        }
        .tab-btn:last-child { 
            border-right: none; 
        }
        .tab-btn.active { 
            color: #000000; 
            background: #00ff66; 
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .console-log { 
            height: 480px; 
            padding: 20px; 
            overflow-y: auto; 
            background: #000000; 
            border-bottom: 2px solid #00ff66; 
            font-size: 0.95em; 
            line-height: 1.6; 
        }
        .log-entry { 
            margin-bottom: 18px; 
            border-left: 3px solid #00ff66; 
            padding-left: 12px; 
            white-space: pre-wrap; 
            word-break: break-word; 
        }
        .input-area { 
            padding: 20px; 
            background: #050a05; 
        }
        textarea { 
            width: 100%; 
            height: 110px; 
            background: #000000; 
            color: #00ff66; 
            border: 2px solid #00ff66; 
            border-radius: 6px; 
            padding: 12px; 
            font-family: 'Courier New', monospace; 
            font-size: 1em; 
            box-sizing: border-box; 
            resize: vertical; 
        }
        textarea:focus { 
            outline: none; 
            box-shadow: 0 0 15px #00ff66; 
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        button.send-btn { 
            flex: 4;
            background: #00ff66; 
            color: #000000; 
            border: none; 
            padding: 16px; 
            font-size: 1.05em; 
            font-weight: bold; 
            font-family: monospace; 
            cursor: pointer; 
            border-radius: 6px; 
            transition: all 0.3s; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        button.send-btn:hover { 
            background: #00cc55; 
            box-shadow: 0 0 15px #00ff66; 
        }
        .hint-text {
            color: #00aa44;
            font-size: 0.75em;
            margin-top: 4px;
            font-family: monospace;
        }
        .matrix-energy { 
            font-size: 0.8em; 
            color: #00ff66; 
            opacity: 0.7;
            margin-top: 6px; 
            font-weight: bold; 
        }
        .alert-banner { 
            font-size: 0.85em; 
            color: #ffaa00; 
            font-weight: bold; 
            margin-bottom: 5px; 
        }
    </style>
</head>
<body>
<div class="console-container">
    <div class="tabs-bar">
        <button class="tab-btn active" onclick="cambiarCanal('chat_directo', this)">💬 Chat Directo</button>
        <button class="tab-btn" onclick="cambiarCanal('ingenieria', this)">💻 Code Lab</button>
        <button class="tab-btn" onclick="cambiarCanal('peliculas', this)">🎬 Cine Matrix</button>
        <button class="tab-btn" onclick="cambiarCanal('evolucion', this)">🧬 Auto-Evolución</button>
    </div>
    
    <div id="console-log" class="console-log">
        <div class="log-entry" style="color: #00ff66;">[SISTEMA]: Enlace directo secuencial establecido. Canal #CHAT_DIRECTO activo. Listo para operar, Miguel.</div>
    </div>
    
    <div class="input-area">
        <textarea id="idea-input" placeholder="Escribe tu petición aquí... (Soporta múltiples líneas)"></textarea>
        <div class="hint-text">💡 Consejo: Puedes usar Ctrl + Enter como atajo rápido para transmitir.</div>
        <div class="button-row">
            <button class="send-btn" onclick="transmitirAlNucleo()">Transmitir al Núcleo</button>
        </div>
    </div>
</div>

<script>
let canalActual = 'chat_directo';

// Conmutador interactivo de pestañas
function cambiarCanal(nuevoCanal, elemento) {
    canalActual = nuevoCanal;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    elemento.classList.add('active');
    
    const log = document.getElementById('console-log');
    log.innerHTML += `<div class="log-entry" style="color: #00aa44;">[SISTEMA]: Enrutando flujo de datos hacia canal #${nuevoCanal.toUpperCase()}.</div>`;
    log.scrollTop = log.scrollHeight;
}

// Escuchador de teclado para pegar código cómodamente
document.getElementById('idea-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        transmitirAlNucleo();
    }
});

// Motor de transmisión asíncrono unificado con window.location.origin
async function transmitirAlNucleo() {
    const input = document.getElementById('idea-input');
    const log = document.getElementById('console-log');
    
    if (!input || !log) return;

    const idea = input.value.trim();
    if (!idea) return;

    // Pintar la transmisión local en color ámbar de inmediato
    log.innerHTML += `<div class="log-entry" style="color: #ffaa00;">📡 [Miguel — Transmisión Activa]:<br>${escaparHTML(idea)}</div>`;
    input.value = '';
    log.scrollTop = log.scrollHeight;

    try {
        // Enrutamiento absoluto automático a prueba de fallos de Railway
        const urlDestino = window.location.origin + '/nucleo-consulta';
        
        const response = await fetch(urlDestino, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idea: idea, tema: canalActual })
        });
        
        const data = await response.json();
        
        let alertaHtml = "";
        if (data.modo_operacion === "CONTINGENCIA_LOCAL") {
            alertaHtml = `<div class="alert-banner">⚠️ [ALERTA]: Enlace caído o saturado. Operando bajo contingencia local.</div>`;
        }

        if (data.status === 'success') {
            log.innerHTML += `
                <div class="log-entry" style="color: #00ff66;">
                    ${alertaHtml}
                    🧠 [Núcleo]: ${formatearRespuesta(data.analisis_nucleo)}
                    <div class="matrix-energy"> ↳ Registro Relacional: ${data.registro_id} | Resonancia: ${data.energia} Qubits | Modo: ${data.modo_operacion}</div>
                </div>`;
        } else {
            log.innerHTML += `<div class="log-entry" style="color: #ff3333;">⚠️ [Error Interno]: ${data.mensaje}</div>`;
        }
    } catch (error) {
        log.innerHTML += `<div class="log-entry" style="color: #ff3333;">⚠️ [Fallo Crítico]: La pasarela de red externa o la API de Gemini no devolvieron un token válido.</div>`;
    }
    log.scrollTop = log.scrollHeight;
}

function escaparHTML(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function formatearRespuesta(texto) {
    if (!texto) return "";
    return escaparHTML(texto).replace(/\\n/g, "<br>").replace(/\n/g, "<br>");
}
</script>
</body>
</html>
