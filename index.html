<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NÚCLEO IA</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:sans-serif;}
        body {background:#000; color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px;}
        .chat {width:100%; max-width:800px; background:#1a1a1a; border-radius:10px; display:flex; flex-direction:column; height:85vh; border:1px solid #333;}
        .cabecera {background:#2d2d2d; padding:15px; text-align:center; font-weight:bold; border-bottom:1px solid #444;}
        .mensajes {flex:1; padding:20px; overflow-y:auto; background:#1a1a1a;}
        .msg {margin:10px 0; padding:12px 16px; border-radius:6px; max-width:80%; white-space:pre-wrap;}
        .usuario {background:#3a3a3a; margin-left:auto; border:1px solid #555;}
        .ia {background:#262626; margin-right:auto; border:1px solid #555;}
        .entrada {display:flex; padding:15px; background:#2d2d2d; border-top:1px solid #444; gap:10px;}
        #texto {flex:1; background:#1a1a1a; color:#fff; border:1px solid #555; border-radius:6px; padding:12px;}
        #enviar {background:#444; color:#fff; border:none; padding:0 20px; border-radius:6px; cursor:pointer;}
        #enviar:hover {background:#666;}
        ::-webkit-scrollbar {width:6px;}
        ::-webkit-scrollbar-thumb {background:#555; border-radius:3px;}
    </style>
</head>
<body>
<div class="chat">
    <div class="cabecera">🧠 NÚCLEO IA - CONECTADO</div>
    <div id="cajaMensajes" class="mensajes">
        <div class="msg ia">✅ Sistema listo.<br><br>ℹ️ Enseña: Tema --- Explicación<br>ℹ️ Pregunta: Solo escribe el tema</div>
    </div>
    <div class="entrada">
        <textarea id="texto" placeholder="Escribe algo..." rows="2"></textarea>
        <button id="enviar" onclick="enviar()">ENVIAR</button>
    </div>
</div>
<script>
    const caja = document.getElementById('cajaMensajes');
    const input = document.getElementById('texto');
    input.addEventListener('keydown', e => { if(e.ctrlKey && e.key === 'Enter') { e.preventDefault(); enviar(); } });

    async function enviar() {
        const txt = input.value.trim();
        if(!txt) return;
        agregar(txt, true);
        input.value = '';
        try {
            const res = await fetch('/nucleo-procesar', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({mensaje:txt})
            });
            const datos = await res.json();
            agregar(datos.respuesta, false);
        } catch (e) {
            agregar("❌ Error de conexión", false);
        }
    }
    function agregar(t, u) {
        const d = document.createElement('div');
        d.className = `msg ${u ? 'usuario' : 'ia'}`;
        d.textContent = t;
        caja.appendChild(d);
        caja.scrollTop = caja.scrollHeight;
    }
</script>
</body>
</html>
